RT.forEach((r,i)=>lbR(X(EDGE),Y(692+i*36),r[0]+' <span class="c">//</span> <b>'+r[1]+'</b>'));

lbR(X(EDGE),H-Y(160),'ODIN <span class="c">·</span> TAILNET');
lbR(X(EDGE),H-Y(124),'NO. <b>15</b>','color:#7d8593');

// ===========================================================================
// Zeichnen (erst wenn alle Symbole geladen sind)
// ===========================================================================
const IM={};let pend=0;
Object.keys(SVG).forEach(k=>{pend++;const im=new Image();
  im.onload=()=>{IM[k]=im;if(--pend===0)draw();};im.src=SVG[k];});

function draw(){
const STEP=20,SQ=16,NX=Math.floor(W/STEP),NY=Math.floor(H/STEP);
let seed=SEED;const rnd=()=>((seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff);
g.fillStyle='#0d0f14';g.fillRect(0,0,W,H);

// ---- Glyphen-Maske: aus der SVG die dunkle Innenform als Alpha herausrechnen
function glyphMask(m){
  const n=Math.round(DD);
  const c=document.createElement('canvas');c.width=c.height=n;
  const x=c.getContext('2d');x.drawImage(IM[m.k],0,0,n,n);
  const d=x.getImageData(0,0,n,n),p=d.data;
  const Lr=0.299*m.rgb[0]+0.587*m.rgb[1]+0.114*m.rgb[2],Ld=14;
  for(let i=0;i<p.length;i+=4){
    const a=p[i+3]/255,Lp=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
    let t=a*(Lr-Lp)/(Lr-Ld); t=t<0?0:t>1?1:t;
    p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=Math.round(t*255);
  }
  x.putImageData(d,0,0);return c;
}
const GC=document.createElement('canvas');GC.width=W;GC.height=H;
const gcx=GC.getContext('2d');
MANA.forEach((m,i)=>gcx.drawImage(glyphMask(m),Math.round(V[i].x-DR),Math.round(V[i].y-DR)));

// ---- Konstruktionslinien unter das Raster ----
function line(a,b,st,lw){g.strokeStyle=st;g.lineWidth=lw;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
FOE.forEach(e=>line(V[e[0]],V[e[1]],'rgba(150,158,172,0.26)',2));
ALLY.forEach(e=>line(V[e[0]],V[e[1]],'rgba(150,158,172,0.44)',2));
g.strokeStyle='rgba(150,158,172,0.20)';g.lineWidth=2;
g.beginPath();g.arc(CX,PCY,RO,0,Math.PI*2);g.stroke();
MANA.forEach(m=>{const a=m.ang*Math.PI/180;
  g.beginPath();g.moveTo(CX+Math.cos(a)*(RO-16*S),PCY+Math.sin(a)*(RO-16*S));
  g.lineTo(CX+Math.cos(a)*(RO+16*S),PCY+Math.sin(a)*(RO+16*S));g.stroke();});
ALLY.forEach(e=>{const mx=(V[e[0]].x+V[e[1]].x)/2,my=(V[e[0]].y+V[e[1]].y)/2;
  g.fillStyle='rgba(150,158,172,0.45)';g.fillRect(mx-5,my-5,10,10);});

// ---- Raster ----
function discAt(px,py){
  for(let i=0;i<5;i++){const v=V[i];
    for(const dx of [2,8,14])for(const dy of [2,8,14]){
      const ex=px+dx-v.x,ey=py+dy-v.y;
      if(ex*ex+ey*ey<=DR*DR)return i;}}
  return -1;}

const chX=[14,15,NX-16,NX-15],chY=[9,10,NY-10,NY-9];
const blocks=[[3,3,28,24],[3,29,28,24],[NX-31,3,28,24],[NX-31,29,28,24],
              [3,55,28,14],[NX-31,55,28,14],[34,3,NX-68,5],[34,NY-8,NX-68,5]];
const dens=[0.86,0.62,0.90,0.66,0.48,0.52,0.42,0.42];
const zones=[[X(L)-20*S,Y(150),700*S,110*S],
             [X(L)-20*S,Y(935),700*S,140*S],
             [X(L)-20*S,Y(1118),700*S,130*S],
             [X(EDGE)-620*S,Y(306),620*S,300*S],
             [X(EDGE)-620*S,Y(616),620*S,300*S],
             [X(EDGE)-460*S,H-Y(190),460*S,120*S]];

const cells=[];   // fuer die Fuellung im Glyphen-Loch
for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){
  const px=x*STEP+2,py=y*STEP+2;
  const di=discAt(px,py);
  if((chX.includes(x)||chY.includes(y))&&di<0)continue;
  let inZ=false;zones.forEach(z=>{if(px>=z[0]&&px<z[0]+z[2]&&py>=z[1]&&py<z[1]+z[3])inZ=true;});

  let d=0.30;
  blocks.forEach((b,i)=>{if(x>=b[0]&&x<b[0]+b[2]&&y>=b[1]&&y<b[1]+b[3])d=dens[i];});
  d+=Math.sin(x*0.12)*0.10+Math.sin(y*0.16+0.8)*0.08;
  if(di<0&&rnd()>d)continue;

  if(di>=0){
    const m=MANA[di],v=V[di];
    // leichter Verlauf ueber die Scheibe: links oben hell, rechts unten satt
    const t=((px-(v.x-DR))/DD)*0.42+((py-(v.y-DR))/DD)*0.58+(rnd()-0.5)*0.10;
    const f=1.16-0.42*Math.max(0,Math.min(1,t));
    const col=[Math.min(255,m.rgb[0]*f),Math.min(255,m.rgb[1]*f),Math.min(255,m.rgb[2]*f)];
    g.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(0.86+rnd()*0.14).toFixed(3)+')';
    g.fillRect(px,py,SQ,SQ);
    cells.push([px,py,0.09+rnd()*0.12]);
  }else{
    const b=0.62+(y/NY)*0.30+(rnd()-0.5)*0.22;
    const col=[150*b+18,158*b+18,172*b+20];
    let a=0.10+rnd()*0.22;
    const ex=px+SQ/2-CX,ey=py+SQ/2-PCY;
    if(ex*ex+ey*ey<RO*RO)a*=0.55;          // Raster unter dem Rad zuruecknehmen
    if(inZ)a*=0.12;
    g.fillStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a.toFixed(3)+')';
    g.fillRect(px,py,SQ,SQ);
  }
}

// ---- Glyphen scharf ausstanzen und mit feinem Grau fuellen ----
g.globalCompositeOperation='destination-out';
g.drawImage(GC,0,0);
g.globalCompositeOperation='source-over';

const TX=document.createElement('canvas');TX.width=W;TX.height=H;
const tx=TX.getContext('2d');
cells.forEach(c=>{tx.fillStyle='rgba(168,176,190,'+c[2].toFixed(3)+')';tx.fillRect(c[0],c[1],SQ,SQ);});
tx.globalCompositeOperation='destination-in';tx.drawImage(GC,0,0);
g.drawImage(TX,0,0);

// ---- Leiterbahnen ----
g.lineWidth=2;
const paths=[[[0,Y(200)],[X(-880),Y(200)],[X(-800),Y(120)],[W,Y(120)]],
             [[0,H-Y(150)],[X(880),H-Y(150)],[X(960),H-Y(70)],[W,H-Y(70)]],
             [[X(-1000),0],[X(-1000),Y(160)],[X(-1080),Y(240)],[X(-1080),H]],
             [[X(1020),0],[X(1020),H-Y(200)],[X(1100),H-Y(120)],[W,H-Y(120)]]];
paths.forEach((p,i)=>{g.strokeStyle='rgba(150,158,172,0.20)';
  g.beginPath();g.moveTo(p[0][0],p[0][1]);for(let k=1;k<p.length;k++)g.lineTo(p[k][0],p[k][1]);g.stroke();
  p.slice(1,-1).forEach(v=>{g.fillStyle='rgba(150,158,172,0.45)';g.fillRect(v[0]-5,v[1]-5,10,10);});});
document.body.dataset.done='1';
}
</script></body></html>
