<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>OpenMana – Spieltisch-Vorlage</title>
<link rel="stylesheet" href="tisch.css">
</head>
<body>

<!-- Shared SVG pieces: emblem, life medallion, card back, crystal, candle, vine, table ornament. -->
<svg class="defs" aria-hidden="true" width="0" height="0">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe6b0"/><stop offset=".45" stop-color="#d9ac5c"/><stop offset="1" stop-color="#8a5f22"/>
    </linearGradient>
    <linearGradient id="gold-quer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a5f22" stop-opacity="0"/><stop offset=".5" stop-color="#e9c47a"/><stop offset="1" stop-color="#8a5f22" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="medaillon-innen" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#26324a"/><stop offset=".7" stop-color="#101724"/><stop offset="1" stop-color="#05080e"/>
    </radialGradient>
    <linearGradient id="kristall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6f1ff"/><stop offset=".35" stop-color="#5fb4ff"/><stop offset="1" stop-color="#1a3fa8"/>
    </linearGradient>
    <linearGradient id="kristall-dunkel" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc6ff"/><stop offset="1" stop-color="#10286e"/>
    </linearGradient>
    <linearGradient id="kerze" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f7a5c"/><stop offset=".4" stop-color="#efe1c4"/><stop offset="1" stop-color="#7a6447"/>
    </linearGradient>
    <radialGradient id="flamme" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#fffbe8"/><stop offset=".4" stop-color="#ffd36b"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="schein" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffc768" stop-opacity=".55"/><stop offset="1" stop-color="#ff9a3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rueckseite-grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a44"/><stop offset=".55" stop-color="#0e1626"/><stop offset="1" stop-color="#1a1430"/>
    </linearGradient>
    <linearGradient id="pfeil-verlauf" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#ff4d2e"/>
    </linearGradient>
    <linearGradient id="blatt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5a35"/><stop offset="1" stop-color="#112417"/>
    </linearGradient>

    <!-- The emblem: an eight-pointed star in a ring (logo, card back, centre rune). -->
    <symbol id="emblem" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle cx="50" cy="50" r="38" fill="none" stroke="url(#gold)" stroke-width="1" stroke-dasharray="1.5 3.2"/>
      <path d="M50 4 57 43 96 50 57 57 50 96 43 57 4 50 43 43Z" fill="url(#gold)"/>
      <path d="M50 22 54 46 78 50 54 54 50 78 46 54 22 50 46 46Z" fill="#0d121b" opacity=".55" transform="rotate(45 50 50)"/>
      <circle cx="50" cy="50" r="6" fill="#0d121b" stroke="url(#gold)" stroke-width="2"/>
    </symbol>

    <!-- Life medallion: gold ring with ticks and four gems; the number is HTML on top. -->
    <symbol id="medaillon" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="56" fill="#05080e" stroke="url(#gold)" stroke-width="4"/>
      <circle cx="60" cy="60" r="49" fill="url(#medaillon-innen)" stroke="url(#gold)" stroke-width="1.5"/>
      <circle cx="60" cy="60" r="52.5" fill="none" stroke="#e9c47a" stroke-width="2.4" stroke-dasharray="1 5.6" opacity=".8"/>
      <g fill="url(#gold)">
        <path d="M60 0 66 8 60 14 54 8Z"/><path d="M60 120 66 112 60 106 54 112Z"/>
        <path d="M0 60 8 54 14 60 8 66Z"/><path d="M120 60 112 54 106 60 112 66Z"/>
      </g>
      <circle cx="60" cy="8" r="2.2" fill="#9fd6ff"/>
    </symbol>

    <!-- OpenMana's own card back (no publisher artwork). -->
    <symbol id="rueckseite" viewBox="0 0 63 88">
      <rect x=".5" y=".5" width="62" height="87" rx="3.5" fill="#05080e"/>
      <rect x="2.5" y="2.5" width="58" height="83" rx="2.5" fill="url(#rueckseite-grund)" stroke="url(#gold)" stroke-width="1"/>
      <rect x="5" y="5" width="53" height="78" rx="1.5" fill="none" stroke="#e9c47a" stroke-width=".4" opacity=".6"/>
      <path d="M31.5 9 33 15M31.5 79 30 73" stroke="#e9c47a" stroke-width=".5" opacity=".5"/>
      <use href="#emblem" x="14" y="26.5" width="35" height="35"/>
    </symbol>

    <!-- Mana crystal cluster. -->
    <symbol id="kristall-gruppe" viewBox="0 0 120 140">
      <path d="M58 2 74 40 68 128 48 128 42 40Z" fill="url(#kristall)"/>
      <path d="M58 2 74 40 58 128Z" fill="#ffffff" opacity=".18"/>
      <path d="M58 2 42 40 50 128Z" fill="#0a1d5c" opacity=".3"/>
      <path d="M28 48 42 70 40 130 22 130 18 72Z" fill="url(#kristall-dunkel)"/>
      <path d="M28 48 42 70 32 130Z" fill="#fff" opacity=".14"/>
      <path d="M92 58 104 84 98 132 82 132 80 84Z" fill="url(#kristall-dunkel)"/>
      <path d="M92 58 104 84 92 132Z" fill="#fff" opacity=".16"/>
      <path d="M8 112 20 104 30 134 6 134Z" fill="url(#kristall)" opacity=".85"/>
      <path d="M104 116 116 110 118 136 102 136Z" fill="url(#kristall)" opacity=".8"/>
      <ellipse cx="60" cy="134" rx="58" ry="6" fill="#0a0d14" opacity=".9"/>
    </symbol>

    <!-- Candle: flame and glow animate in CSS. -->
    <symbol id="kerze-symbol" viewBox="0 0 60 140" overflow="visible">
      <circle class="kerzen-schein" cx="30" cy="38" r="34" fill="url(#schein)"/>
      <rect x="18" y="52" width="24" height="86" rx="3" fill="url(#kerze)"/>
      <path d="M18 56c4 4 2 14 5 16s3-10 6-12 4 6 7 6 3-8 6-10v-4H18Z" fill="#f6ecd6"/>
      <path d="M30 52v-6" stroke="#2a1d10" stroke-width="1.6"/>
      <path class="kerzen-flamme" d="M30 18c5 9 9 15 9 22a9 9 0 0 1-18 0c0-7 4-13 9-22Z" fill="url(#flamme)"/>
      <ellipse cx="30" cy="138" rx="20" ry="3" fill="#0a0d14"/>
    </symbol>

    <!-- A trailing vine of leaves for the table's corners. -->
    <symbol id="ranke" viewBox="0 0 200 120">
      <path d="M0 110C40 100 70 70 110 64s70 8 90-10" fill="none" stroke="#1d3a22" stroke-width="3"/>
      <g fill="url(#blatt)">
        <path d="M20 104c-4-16 6-28 20-30-2 14-8 26-20 30Z"/>
        <path d="M46 92c2-18 16-26 30-24-6 13-16 22-30 24Z"/>
        <path d="M60 86c-14-6-18-20-12-32 10 8 14 20 12 32Z"/>
        <path d="M96 66c4-16 18-22 30-18-6 12-17 18-30 18Z"/>
        <path d="M112 64c-12-10-12-24-4-32 8 10 9 22 4 32Z"/>
        <path d="M140 68c8 12 22 14 32 6-10-8-22-10-32-6Z"/>
        <path d="M160 64c2-14 14-22 26-20-4 12-14 20-26 20Z"/>
      </g>
      <g fill="#3c6b43" opacity=".55">
        <path d="M46 92c8-8 16-14 30-24"/><path d="M96 66c10-6 20-12 30-18"/>
      </g>
    </symbol>

    <!-- Large oval ornament across both battlefields (stretched; strokes stay thin). -->
    <symbol id="tisch-ornament" viewBox="0 0 1000 600" preserveAspectRatio="none">
      <g fill="none" stroke="#d9ac5c" vector-effect="non-scaling-stroke">
        <ellipse cx="500" cy="300" rx="480" ry="285" stroke-width="1.5" opacity=".5" vector-effect="non-scaling-stroke"/>
        <ellipse cx="500" cy="300" rx="455" ry="262" stroke-width="1" opacity=".3" stroke-dasharray="2 7" vector-effect="non-scaling-stroke"/>
        <ellipse cx="500" cy="300" rx="300" ry="170" stroke-width="1" opacity=".18" vector-effect="non-scaling-stroke"/>
        <path d="M20 300H980M500 15V585" stroke-width="1" opacity=".18" vector-effect="non-scaling-stroke"/>
        <path d="M160 100 840 500M160 500 840 100" stroke-width="1" opacity=".08" vector-effect="non-scaling-stroke"/>
      </g>
    </symbol>
  </defs>
</svg>

<main class="tisch" id="tisch" data-szene="konzept">
  <div class="tisch-grund" aria-hidden="true"></div>
  <svg class="tisch-ornament" aria-hidden="true"><use href="#tisch-ornament"/></svg>
  <div class="deko" aria-hidden="true">
    <svg class="deko-kristall k1"><use href="#kristall-gruppe"/></svg>
    <svg class="deko-kristall k2"><use href="#kristall-gruppe"/></svg>
    <svg class="deko-kristall k3"><use href="#kristall-gruppe"/></svg>
    <svg class="deko-kerze c1"><use href="#kerze-symbol"/></svg>
    <svg class="deko-kerze c2"><use href="#kerze-symbol"/></svg>
    <svg class="deko-ranke r1"><use href="#ranke"/></svg>
    <svg class="deko-ranke r2"><use href="#ranke"/></svg>
  </div>

  <header class="kopf">
    <div class="marke"><svg class="marke-emblem"><use href="#emblem"/></svg><span class="marke-name">OpenMana</span></div>
    <nav class="kopf-nav" id="kopf-nav"></nav>
    <div class="kopf-rechts">
      <span class="zug-info" id="zug-info"></span>
      <button class="symbol-knopf" type="button" aria-label="Menü (in der Vorlage: Beispiel wechseln)" title="Vorlage: Beispiel wechseln" data-icon="menu"></button>
    </div>
  </header>

  <section class="leiste leiste-gegner" id="leiste-gegner"></section>
  <section class="feld feld-gegner" id="feld-gegner"></section>
  <div class="mitte" id="mitte"><svg class="mitte-rune"><use href="#emblem"/></svg></div>
  <section class="feld feld-ich" id="feld-ich"></section>
  <section class="leiste leiste-ich" id="leiste-ich"></section>
  <section class="hand" id="hand"></section>

  <aside class="tafel chronik" id="chronik"></aside>
  <aside class="tafel phasen" id="phasen"></aside>
  <footer class="aktionsleiste" id="aktionsleiste"></footer>

  <svg class="pfeile" id="pfeile" aria-hidden="true">
    <defs>
      <marker id="pfeilspitze" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto-start-reverse">
        <path d="M0 0 10 5 0 10 3 5Z" fill="#ff5a32"/>
      </marker>
    </defs>
  </svg>
</main>


<script src="karten.js"></script>
<script src="vorlage.js"></script>
</body>
</html>
